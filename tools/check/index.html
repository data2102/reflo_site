<style>
  .q{border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-top:14px;background:var(--surface)}
  .q legend{float:left;width:100%;padding:0;margin-bottom:14px;font-size:var(--fs-subhead);font-weight:var(--fw-bold)}
  .q legend span{color:var(--accent-strong);margin-right:8px;font-variant-numeric:tabular-nums}
  .q .as{clear:both;display:grid;gap:8px}
  .q label{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--border);
    border-radius:var(--radius-md);cursor:pointer;font-size:var(--fs-body);color:var(--text-secondary);line-height:1.5}
  .q label:hover{border-color:var(--border-strong)}

<script>
(function () {
  "use strict";
  /* 답마다: [글, 값]. 값의 뜻은 문항마다 다르다 (아래 계산 참고) */
  var Q = [
    { k: "freq", q: "얼마나 자주 하나요?", a: [["매일", 240], ["매주", 50], ["매달", 12], ["분기에 한 번, 또는 가끔", 4]] },
    { k: "dur", q: "한 번 할 때 얼마나 걸리나요?", a: [["10분 안쪽", 1 / 6], ["30분 ~ 1시간", 0.75], ["반나절", 4], ["하루 이상", 8]] },
    { k: "src", q: "자료는 어디서 오나요?", a: [["시스템에서 내려받은 파일 (엑셀·CSV)", 3], ["다른 사람이 보내 주는 엑셀", 2], ["내가 손으로 입력", 1], ["종이, 사진, 스캔한 PDF", 0]] },
    { k: "shape", q: "자료의 모양이 매번 같은가요?", a: [["항상 같아요", 3], ["가끔 열이 늘거나 이름이 바뀌어요", 2], ["보내는 사람마다 달라요", 1], ["매번 달라요", 0]] },
    { k: "rule", q: "하는 순서를 다른 사람에게 말로 알려 줄 수 있나요?", a: [["순서대로 설명할 수 있어요", 3], ["대부분은 되는데 몇 군데는 감으로 해요", 2], ["그때그때 보고 판단해요", 0]] },
    { k: "outp", q: "결과물은 무엇인가요?", a: [["정리된 엑셀이나 표", "t"], ["보고서나 현황판", "r"], ["메일이나 문서를 여러 사람에게 보내기", "m"], ["다른 시스템에 다시 입력", "s"]] },
    { k: "risk", q: "틀리면 어떻게 되나요?", a: [["다시 하면 돼요", 0], ["보고가 틀려서 곤란해져요", 1], ["돈이나 고객에게 바로 영향이 가요", 2]] },
    { k: "sys", q: "사내 시스템에 프로그램이 직접 접속해야 하나요?", a: [["아니요, 파일로 주고받으면 돼요", 3], ["내려받기와 올리기는 제가 해도 돼요", 3], ["꼭 자동으로 접속해야 해요", 0]] }
  ];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  $("f").innerHTML = Q.map(function (x, i) {
    return '<fieldset class="q"><legend><span>' + (i + 1) + "</span>" + esc(x.q) + '</legend><div class="as">'
      + x.a.map(function (a, j) { return '<label><input type="radio" name="' + x.k + '" value="' + j + '"> ' + esc(a[0]) + "</label>"; }).join("")
      + "</div></fieldset>";
  }).join("");

  function 답() {
    var o = {}, n = 0;
    Q.forEach(function (x) {
      var el = document.querySelector('input[name="' + x.k + '"]:checked');
      if (el) { o[x.k] = { 글: x.a[+el.value][0], 값: x.a[+el.value][1] }; n++; }
    });
    o.n = n;
    return o;
  }

  var 알림 = false;
  function 그리기() {
    var a = 답();
    $("pt").textContent = a.n + " / " + Q.length;
    $("pb").style.width = (a.n / Q.length * 100) + "%";
    if (a.n < Q.length) { $("out").innerHTML = ""; return; }

    // 가능성: 자료 출처 + 모양 + 규칙 + 시스템 (각 0~3, 합 12)
    var 가능 = a.src.값 + a.shape.값 + a.rule.값 + a.sys.값;
    // 효과: 1년 횟수 × 한 번 걸리는 시간
    var 시간 = Math.round(a.freq.값 * a.dur.값);

    var 막힘 = [];
    if (a.src.값 === 0) 막힘.push("<b>자료가 종이·사진·스캔이에요.</b> 글자를 읽어 내는 단계에서 틀린 값이 섞여요. 같은 자료를 엑셀이나 CSV로 받을 수 있는지부터 알아보세요.");
    if (a.rule.값 === 0) 막힘.push("<b>판단이 들어가는 일이에요.</b> 판단은 사람에게 남기고, 판단하기 전까지의 준비(모으기·정리·표시)만 자동으로 하는 게 맞아요.");
    if (a.sys.값 === 0) 막힘.push("<b>사내 시스템 직접 접속은 사내 전산 담당과 풀어야 해요.</b> 내려받기와 올리기만 직접 하시면 그 사이는 자동으로 할 수 있어요.");
    if (a.shape.값 <= 1) 막힘.push("<b>자료 모양이 제각각이에요.</b> 받는 양식을 하나로 정하는 것이 먼저예요. 양식만 맞춰도 손이 절반으로 줄어요.");
    if (a.src.값 === 1) 막힘.push("<b>손으로 입력하는 자료예요.</b> 입력 자체는 남아요. 입력한 뒤의 집계·보고만 자동으로 할 수 있어요.");

    var 급, 제목, 설명;
    if (가능 >= 10 && !막힘.length) { 급 = ""; 제목 = "자동화하기 좋은 일이에요"; 설명 = "자료가 파일로 오고, 모양이 일정하고, 순서를 말로 설명할 수 있어요. 이 세 가지가 갖춰지면 대부분 됩니다."; }
    else if (가능 >= 6) { 급 = " mid"; 제목 = "일부만 자동화하는 게 맞아요"; 설명 = "전부를 맡기기보다, 손이 가장 많이 가는 구간을 골라 자동으로 바꾸는 편이 안전해요."; }
    else { 급 = " low"; 제목 = "자동화보다 먼저 할 일이 있어요"; 설명 = "지금 상태로 자동화하면 틀린 결과가 빨리 나올 뿐이에요. 아래부터 풀어 보세요."; }

    var 값어치;
    if (시간 >= 40) 값어치 = "맡겨서 만들 만한 크기예요.";
    else if (시간 >= 10) 값어치 = "수식이나 무료 도구로 먼저 줄여 보고, 그래도 남으면 맡기세요.";
    else 값어치 = "아끼는 시간보다 만드는 비용이 클 수 있어요. 무료 도구나 수식이면 충분해요.";

    var 주의 = a.risk.값 === 2 ? "<li><b>틀리면 돈이나 고객에게 영향이 가는 일이에요.</b> 결과를 내보내기 전에 합계를 원본과 맞춰 보는 단계가 꼭 있어야 해요. 그 단계가 없는 자동화는 쓰지 마세요.</li>"
      : a.risk.값 === 1 ? "<li><b>보고에 쓰는 숫자예요.</b> 원본 합계와 결과 합계를 나란히 보여 주는 검산 칸을 넣어 달라고 하세요.</li>" : "";

    var 다음 = {
      t: '<li>여러 파일을 모으는 일이라면 <a href="/tools/merge/">엑셀 파일 합치기</a>를 먼저 써 보세요. 무료예요.</li>',
      r: '<li>매달 만드는 보고라면 <a href="/works/">정기 보고 대시보드 예시</a>(첫 번째 작업물)를 눌러 보세요. 같은 자료로 결론이 어떻게 달라지는지 볼 수 있어요.</li>',
      m: '<li>여러 사람에게 보내는 메일이라면 <a href="/mailer/">단체 메일 발송 프로그램</a> 체험판을 써 보세요.</li>',
      s: "<li>다른 시스템에 다시 넣는 일이라면, 그 시스템이 받는 <b>올리기용 양식</b>이 있는지 확인하세요. 있으면 그 양식까지 자동으로 만들 수 있어요.</li>"
    }[a.outp.값];

    var 글 = "[자동화하고 싶은 업무]\n"
      + Q.map(function (x) { return "· " + x.q + " → " + a[x.k].글; }).join("\n")
      + "\n\n[진단 결과] " + 제목 + " · 1년에 약 " + 시간 + "시간";

    $("out").innerHTML = '<section class="res' + 급 + '"><h2>' + 제목 + '</h2><p class="sub">' + 설명 + "</p>"
      + '<div class="two"><div><span>자동화 가능성</span><b>' + 가능 + " / 12</b><small>자료 출처 · 모양 · 규칙 · 시스템 (각 3점)</small></div>"
      + "<div><span>지금 쓰는 시간</span><b>1년에 약 " + 시간.toLocaleString("ko-KR") + "시간</b><small>" + esc(a.freq.글) + " × " + esc(a.dur.글) + " 으로 어림한 값</small></div></div>"
      + "<p class=\"sub\" style=\"margin:0\">" + 값어치 + "</p>"
      + (막힘.length ? "<h3>먼저 풀 것</h3><ul>" + 막힘.map(function (m) { return "<li>" + m + "</li>"; }).join("") + "</ul>" : "")
      + "<h3>다음에 해 볼 것</h3><ul>" + 주의 + 다음 + "</ul>"
      + "<h3>문의할 때 이대로 붙여 넣으세요</h3><div class=\"brief\" id=\"brief\">" + esc(글) + "</div>"
      + '<div class="dl" style="margin-top:16px"><button type="button" class="ds-btn-pill primary" id="cp"><i class="ti ti-copy"></i> 복사하기</button>'
      + '<a class="ds-btn-pill ghost" href="https://kmong.com/@%EB%A6%AC%ED%94%8C%EB%A1%9CReflo" data-track="go_kmong">크몽에서 문의하기</a></div>'
      + "</section>";

    $("cp").addEventListener("click", function () {
      var b = this;
      function 됨() { b.innerHTML = '<i class="ti ti-check"></i> 복사했어요'; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(글).then(됨, function () {});
      try { if (window.gtag) window.gtag("event", "tool_check_copy"); } catch (e) {}
    });
    if (!알림) { 알림 = true; try { if (window.gtag) window.gtag("event", "tool_check_done", { score: 가능, hours: 시간 }); } catch (e) {} }
    window.진단결과 = { 가능: 가능, 시간: 시간, 제목: 제목, 막힘: 막힘.length };
  }

  $("f").addEventListener("change", 그리기);
  그리기();
})();
</script>
<script src="/analytics.js"></script>
</body>
